<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>Sistema Empresarial</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #0f172a;
}

header {
    background: #0f172a;
    color: white;
    padding: 18px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
}

header h1 {
    font-size: 22px;
}

main {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

.bienvenida {
    background: white;
    padding: 22px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.bienvenida h2 {
    margin-bottom: 8px;
}

.modulos {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
    margin-top: 20px;
}

.modulo {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    cursor: pointer;
    transition: transform .15s;
}

.modulo:hover {
    transform: translateY(-2px);
}

.modulo h3 {
    margin-bottom: 8px;
}

.modulo p {
    color: #64748b;
    font-size: 14px;
}

#clientesModulo {
    display: none;
    margin-top: 25px;
}

.panel {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.panel-header h2 {
    font-size: 22px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 11px 16px;
    cursor: pointer;
    font-weight: bold;
}

.btn-principal {
    background: #0f172a;
    color: white;
}

.btn-secundario {
    background: #e2e8f0;
    color: #0f172a;
}

.btn-editar {
    background: #e2e8f0;
    margin-right: 5px;
}

.btn-eliminar {
    background: #fee2e2;
    color: #991b1b;
}

.buscar {
    width: 100%;
    padding: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    margin-bottom: 15px;
    font-size: 15px;
}

.tabla-contenedor {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 800px;
}

th,
td {
    padding: 12px;
    border-bottom: 1px solid #e2e8f0;
    text-align: left;
}

th {
    background: #f8fafc;
}

.estado {
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.estado-activo {
    background: #dcfce7;
    color: #166534;
}

.estado-inactivo {
    background: #fee2e2;
    color: #991b1b;
}

#formularioCliente {
    display: none;
    margin-bottom: 20px;
    background: #f8fafc;
    padding: 18px;
    border-radius: 10px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.campo {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.campo label {
    font-size: 14px;
    font-weight: bold;
}

.campo input,
.campo select {
    padding: 11px;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
    width: 100%;
    font-size: 15px;
}

.campo-completo {
    grid-column: 1 / -1;
}

.botones-formulario {
    margin-top: 18px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

#mensaje {
    margin-bottom: 15px;
    padding: 12px;
    border-radius: 8px;
    display: none;
}

.mensaje-exito {
    background: #dcfce7;
    color: #166534;
}

.mensaje-error {
    background: #fee2e2;
    color: #991b1b;
}

#estadoConexion {
    margin-top: 20px;
    background: white;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
    font-weight: bold;
}

@media (max-width: 650px) {

    main {
        padding: 12px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .campo-completo {
        grid-column: auto;
    }

    .panel {
        padding: 14px;
    }

    .modulos {
        grid-template-columns: 1fr 1fr;
    }

    .modulo {
        padding: 15px;
    }
}
</style>
</head>

<body>

<header>
    <h1>Siste
