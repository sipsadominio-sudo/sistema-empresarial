<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>Sistema Empresarial</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #0f172a;
        }

        header {
            background: #0f172a;
            color: white;
            padding: 20px;
        }

        header h1 {
            font-size: 23px;
        }

        main {
            padding: 20px;
            max-width: 1200px;
            margin: auto;
        }

        .bienvenida {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }

        .bienvenida h2 {
            margin-bottom: 10px;
        }

        .modulos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .modulo {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }

        .modulo h3 {
            margin-bottom: 8px;
        }

        .modulo p {
            color: #64748b;
            font-size: 14px;
        }

        #estadoConexion {
            margin-top: 25px;
            padding: 18px;
            border-radius: 12px;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
            font-weight: bold;
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>

<header>
    <h1>Sistema Empresarial</h1>
</header>
